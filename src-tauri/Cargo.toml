[package]
name = "openvisual-local"
version = "0.1.0"
description = "Turn text into clean, editable diagrams with a local Ollama model."
edition = "2021"
rust-version = "1.77"

[lib]
# Named `_lib` so the cdylib and the binary do not both emit openvisual_local.pdb
# on Windows (cargo#8519). This matches the upstream Tauri template.
name = "openvisual_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
